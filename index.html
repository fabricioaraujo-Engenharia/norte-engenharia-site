<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norte Engenharia & Automação</title>
    
    <!-- Fonte Nunito do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (via CDN para facilitar o desenvolvimento) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Seu arquivo de CSS personalizado (SEMPRE depois do Tailwind para poder sobrescrever estilos se necessário) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Cabeçalho / Navegação -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#inicio">
                <!-- Imagem apontando para a pasta de assets -->
                <img src="assets/img/image_31c740.png" alt="Norte Engenharia e Automação" class="h-14">
            </a>
            
            <div class="hidden md:flex space-x-8">
                <a href="#inicio" class="hover:text-green-600 font-semibold transition">Início</a>
                <a href="#servicos" class="hover:text-green-600 font-semibold transition">Soluções</a>
                <a href="#como-funciona" class="hover:text-green-600 font-semibold transition">Como Funciona</a>
            </div>
            
            <!-- Botão Menu Mobile -->
            <button id="mobile-menu-btn" class="md:hidden text-gray-800 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </nav>

        <!-- Menu Mobile Oculto -->
        <div id="mobile-menu" class="hidden md:hidden bg-white px-6 py-4 shadow-inner border-t">
            <a href="#inicio" class="block py-2 hover:text-green-600 font-semibold">Início</a>
            <a href="#servicos" class="block py-2 hover:text-green-600 font-semibold">Soluções</a>
            <a href="#como-funciona" class="block py-2 hover:text-green-600 font-semibold">Como Funciona</a>
        </div>
    </header>

    <!-- Seção Principal (Hero) -->
    <section id="inicio" class="bg-gray-900 text-white py-24">
        <div class="container mx-auto px-6 text-center md:text-left flex flex-col md:flex-row items-center gap-12">
            <div class="md:w-1/2">
                <h1 class="text-4xl md:text-5xl font-bold mb-6 leading-tight">Soluções inteligentes para um <span class="text-green-500">futuro mais eficiente</span></h1>
                <p class="text-xl mb-8 text-gray-300">Qualidade, segurança e inovação em cada detalhe do seu projeto. Instalações, automação e projetos elétricos focados em conformidade.</p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                    <a href="#contato" class="btn-pilula bg-green-600 hover:bg-green-700 text-white">Receber proposta técnica</a>
                    <a href="#servicos" class="btn-pilula bg-transparent border-2 border-green-500 hover:bg-green-500 text-white">Ver soluções</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Chamada do arquivo JavaScript no final do body para não travar o carregamento visual -->
    <script src="js/main.js"></script>
</body>
</html>
